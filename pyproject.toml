[project]
name = "rallyvision"
version = "0.1.0"
description = "RallyVision - 网球比赛视频智能分析系统 / Computer-vision tennis match video analyzer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9,<3.12"
dependencies = [
    "opencv-python==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
    "numpy>=1.21.6,<2.0",
    "pillow>=9.2.0,<12.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics>=8.0.0",
    "rtmlib>=0.0.1",
    "onnxruntime==1.18.1",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "moviepy>=1.0.3,<2.0",
    "scipy>=1.7.0",
    "scikit-learn==1.2.2",
    "sktime>=0.18.0",
    "openpyxl>=3.0.0",
    "lap>=0.5.12",
    "httpx>=0.28.1",
]

[tool.uv]
# 本项目是 CLI 应用而非可安装的包，uv 只负责管理依赖环境
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
